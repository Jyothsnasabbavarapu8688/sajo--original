<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – SAJO</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">
    <canvas id="particles-canvas"></canvas>

    <div class="auth-card fade-in-up">
        <div class="auth-logo">
            <div class="logo-sq" style="margin: 0 auto; background: var(--error);">?</div>
            <h2>Reset Password</h2>
            <p>Enter your email to receive recovery instructions</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message {{ 'success' if category == 'success' else 'error' }}" style="position: static; margin-bottom: 20px; min-width: 0; width: 100%;">
                        <i class="fas fa-{{ 'check-circle' if category == 'success' else 'exclamation-circle' }}"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/forgot-password" method="POST">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <div style="position: relative;">
                    <i class="fas fa-envelope" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted); font-size: 0.85rem;"></i>
                    <input type="email" id="email" name="email" class="form-input" placeholder="name@company.com" required style="padding-left: 38px;">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-full" style="justify-content: center; height: 46px;">
                Send Recovery Email
            </button>
        </form>

        <div class="auth-link">
            Remembered your password? <a href="/login">Back to Sign In</a>
        </div>
    </div>

    <script src="/static/particles.js"></script>
    <script>
        const savedTheme = localStorage.getItem('sajo-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
