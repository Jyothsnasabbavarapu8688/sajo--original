<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account – SAJO</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">
    <canvas id="particles-canvas"></canvas>

    <div class="auth-card fade-in-up">
        <div class="auth-logo">
            <div class="logo-sq" style="margin: 0 auto;">S</div>
            <h2>Join SAJO</h2>
            <p>Start transforming your content today</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message {{ 'success' if category == 'success' else 'error' }}" style="position: static; margin-bottom: 20px; min-width: 0; width: 100%;">
                        <i class="fas fa-{{ 'check-circle' if category == 'success' else 'exclamation-circle' }}"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/register" method="POST">
            <div class="form-group">
                <label class="form-label" for="username">Full Name</label>
                <div style="position: relative;">
                    <i class="fas fa-user" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted); font-size: 0.85rem;"></i>
                    <input type="text" id="username" name="username" class="form-input" placeholder="Jyothsna" required style="padding-left: 38px;">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <div style="position: relative;">
                    <i class="fas fa-envelope" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted); font-size: 0.85rem;"></i>
                    <input type="email" id="email" name="email" class="form-input" placeholder="name@company.com" required style="padding-left: 38px;">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div style="position: relative;">
                    <i class="fas fa-lock" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted); font-size: 0.85rem;"></i>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Create a strong password" required style="padding-left: 38px;">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label class="flex items-center gap-8" style="cursor: pointer; font-size: 0.8rem; color: var(--text-secondary);">
                    <input type="checkbox" required style="accent-color: var(--accent);">
                    I agree to the <a href="#" style="color: var(--accent); font-weight: 600;">Terms & Privacy</a>
                </label>
            </div>

            <button type="submit" class="btn btn-gradient w-full" style="justify-content: center; height: 46px;">
                Create Account <i class="fas fa-user-plus"></i>
            </button>
        </form>

        <div class="auth-link">
            Already have an account? <a href="/login">Sign in</a>
        </div>
    </div>

    <script src="/static/particles.js"></script>
    <script>
        const savedTheme = localStorage.getItem('sajo-app-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
