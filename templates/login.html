<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – SAJO</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">
    <canvas id="particles-canvas"></canvas>

    <div class="auth-card fade-in-up">
        <div class="auth-logo">
            <div class="logo-sq" style="margin: 0 auto;">S</div>
            <h2>Welcome Back</h2>
            <p>Sign in to your SAJO workspace</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message {{ 'success' if category == 'success' else 'error' }}" style="position: static; margin-bottom: 20px; min-width: 0; width: 100%;">
                        <i class="fas fa-{{ 'check-circle' if category == 'success' else 'exclamation-circle' }}"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label class="form-label" for="email">Email or Username</label>
                <div style="position: relative;">
                    <i class="fas fa-user-circle" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted); font-size: 0.85rem;"></i>
                    <input type="text" id="email" name="email" class="form-input" placeholder="Your email or username" required style="padding-left: 38px;">
                </div>
            </div>


            <div class="form-group">
                <div class="flex justify-between" style="margin-bottom: 6px;">
                    <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
                    <a href="/forgot-password" style="font-size: 0.75rem; color: var(--accent); font-weight: 600;">Forgot?</a>
                </div>
                <div style="position: relative;">
                    <i class="fas fa-lock" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted); font-size: 0.85rem;"></i>
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required style="padding-left: 38px;">
                </div>
            </div>

            <button type="submit" class="btn btn-gradient w-full" style="margin-top: 10px; justify-content: center; height: 46px;">
                Sign In <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-link">
            Don't have an account? <a href="/register">Create one for free</a>
        </div>
    </div>

    <script src="/static/particles.js"></script>
    <script>
        // Set theme from local storage
        const savedTheme = localStorage.getItem('sajo-app-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
